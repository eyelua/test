// Dark Crown Browser — свои настройки поверх LibreWolf
// Добавляются в конец librewolf.cfg.

// --- Внешний вид ---
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
defaultPref("sidebar.revamp", true);
defaultPref("sidebar.verticalTabs", true);
defaultPref("extensions.activeThemeID", "firefox-compact-dark@mozilla.org");
defaultPref("layout.css.prefers-color-scheme.content-override", 0);
defaultPref("ui.systemUsesDarkTheme", 1);
defaultPref("browser.toolbars.bookmarks.visibility", "never");

// --- Домашняя ---
defaultPref("browser.startup.homepage", "about:newtab");

// --- Не оставлять следов на компьютере ---
defaultPref("places.history.enabled", false);
defaultPref("browser.urlbar.suggest.history", false);
defaultPref("browser.urlbar.suggest.topsites", false);
defaultPref("browser.cache.disk.enable", false);
defaultPref("browser.cache.offline.enable", false);
defaultPref("browser.sessionstore.privacy_level", 2);
defaultPref("browser.sessionstore.resume_from_crash", false);
defaultPref("browser.sessionstore.max_tabs_undo", 0);
defaultPref("browser.sessionstore.max_windows_undo", 0);
defaultPref("browser.download.manager.addToRecentDocs", false);
defaultPref("browser.download.start_downloads_in_tmp_dir", true);
defaultPref("browser.shell.checkDefaultBrowser", false);
defaultPref("browser.taskbar.lists.enabled", false);
defaultPref("browser.taskbar.lists.frequent.enabled", false);
defaultPref("browser.taskbar.lists.recent.enabled", false);
defaultPref("browser.taskbar.lists.tasks.enabled", false);
defaultPref("privacy.sanitize.sanitizeOnShutdown", true);
defaultPref("privacy.clearOnShutdown.cookies", true);
defaultPref("privacy.clearOnShutdown.history", true);
defaultPref("privacy.clearOnShutdown.cache", true);
defaultPref("privacy.clearOnShutdown.downloads", true);
defaultPref("privacy.clearOnShutdown.formdata", true);
defaultPref("privacy.clearOnShutdown.sessions", true);
defaultPref("privacy.clearOnShutdown.offlineApps", true);

// =====================================================================
// ЗАЩИТА СЕССИЙ, ТОКЕНОВ И УЧЁТНЫХ ДАННЫХ
// lockPref: значение нельзя изменить ни в настройках, ни через prefs.js / user.js
// в профиле (их мог бы подменить вредоносный процесс без прав администратора).
// =====================================================================

// --- Токены и куки не лежат на диске ---
// Постоянный приватный режим: куки, токены, кэш и сессии живут только в памяти.
lockPref("browser.privatebrowsing.autostart", true);
lockPref("network.cookie.cookieBehavior", 5);               // полная изоляция сторонних куки
lockPref("network.cookie.thirdparty.sessionOnly", true);
lockPref("network.cookie.sameSite.laxByDefault", true);
lockPref("network.cookie.sameSite.noneRequiresSecure", true);
lockPref("network.cookie.sameSite.schemeful", true);

// --- Токены в адресах не уходят на другие сайты ---
// Referer урезается до домена: пути и параметры (?token=...) наружу не передаются.
lockPref("network.http.referer.trimmingPolicy", 2);
lockPref("network.http.referer.XOriginTrimmingPolicy", 2);
lockPref("privacy.query_stripping.enabled", true);
lockPref("privacy.query_stripping.enabled.pbmode", true);
lockPref("beacon.enabled", false);
lockPref("browser.send_pings", false);

// --- Защита от слежки и отпечатков ---
lockPref("privacy.trackingprotection.enabled", true);
lockPref("privacy.trackingprotection.fingerprinting.enabled", true);
lockPref("privacy.trackingprotection.cryptomining.enabled", true);
lockPref("privacy.trackingprotection.emailtracking.enabled", true);
lockPref("privacy.resistFingerprinting", true);
lockPref("privacy.fingerprintingProtection", true);

// --- Пароли и автозаполнение отключены ---
lockPref("signon.rememberSignons", false);
lockPref("signon.autofillForms", false);
lockPref("signon.generation.enabled", false);
lockPref("signon.firefoxRelay.feature", "disabled");
lockPref("browser.formfill.enable", false);
lockPref("extensions.formautofill.addresses.enabled", false);
lockPref("extensions.formautofill.creditCards.enabled", false);

// --- Автоматическая отправка учётных данных Windows сайтам ---
lockPref("network.http.windows-sso.enabled", false);
lockPref("network.automatic-ntlm-auth.trusted-uris", "");
lockPref("network.automatic-ntlm-auth.allow-proxies", false);
lockPref("network.negotiate-auth.trusted-uris", "");
lockPref("network.negotiate-auth.delegation-uris", "");
lockPref("network.auth.subresource-http-auth-allow", 1);

// --- Только защищённые соединения ---
lockPref("dom.security.https_only_mode", true);
lockPref("dom.security.https_only_mode_send_http_background_request", false);
lockPref("security.mixed_content.block_active_content", true);
lockPref("security.mixed_content.block_display_content", true);
lockPref("security.ssl.require_safe_negotiation", true);
lockPref("security.ssl.treat_unsafe_negotiation_as_broken", true);
lockPref("security.tls.version.min", 3);                    // не ниже TLS 1.2
lockPref("network.IDN_show_punycode", true);                // защита от подделки адресов

// --- Фишинг (главный способ кражи токенов): локальные списки вредоносных сайтов ---
// Загрузки на проверку в Google не отправляются. Чтобы отключить: поставь false.
lockPref("browser.safebrowsing.phishing.enabled", true);
lockPref("browser.safebrowsing.malware.enabled", true);
lockPref("browser.safebrowsing.downloads.remote.enabled", false);

// --- Расширения и удалённое управление ---
// Свой установщик ставит встроенное расширение Crown Tools без подписи Mozilla.
// Установка любых других расширений запрещена политикой InstallAddonsPermission (hardening-policies.json).
// Если подпишешь crowntools.xpi на addons.mozilla.org, можно вернуть true.
defaultPref("xpinstall.signatures.required", false);
lockPref("devtools.debugger.remote-enabled", false);
lockPref("devtools.debugger.force-local", true);
lockPref("devtools.chrome.enabled", false);

// --- Утечки адреса и фоновые запросы ---
lockPref("media.peerconnection.ice.default_address_only", true);
lockPref("media.peerconnection.ice.proxy_only_if_behind_proxy", true);
lockPref("geo.enabled", false);
lockPref("dom.push.enabled", false);
lockPref("dom.webnotifications.enabled", false);
lockPref("network.dns.disablePrefetch", true);
lockPref("network.prefetch-next", false);
lockPref("network.predictor.enabled", false);
lockPref("network.http.speculative-parallel-limit", 0);
lockPref("browser.urlbar.speculativeConnect.enabled", false);
lockPref("browser.search.suggest.enabled", false);
lockPref("browser.urlbar.suggest.searches", false);
lockPref("network.captive-portal-service.enabled", false);
lockPref("network.connectivity-service.enabled", false);
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("toolkit.telemetry.enabled", false);
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("browser.discovery.enabled", false);
