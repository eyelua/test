<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Dark Crown</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="icons/icon-96.png">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Dark Crown">
    <h1>DARK CROWN</h1>
    <form action="https://duckduckgo.com/" method="get" autocomplete="off">
      <input type="search" name="q" placeholder="Поиск в DuckDuckGo" autofocus>
    </form>
    <div class="actions">
      <button id="clean" type="button">Быстрая очистка</button>
      <button id="hide" type="button">Скрыть окна</button>
      <button id="panic" type="button" class="danger">Кнопка паники</button>
    </div>
    <p class="hint">Ctrl+Shift+K — паника &nbsp;·&nbsp; Ctrl+Shift+L — очистка &nbsp;·&nbsp; Alt+Shift+H — скрыть окна</p>
  </main>
  <script src="newtab.js"></script>
</body>
</html>
